<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>餐廳營運後台入口</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft JhengHei", system-ui, sans-serif; color: #172a42; background: #edf3fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; align-items: center; padding: 1.2rem; }
    main { width: min(100%, 38rem); background: #fff; border: 1px solid #ccd9e8; border-radius: 16px; overflow: hidden; margin: auto; box-shadow: 0 18px 45px #1537591c; }
    header { background: #142a43; color: #fff; padding: 1.3rem 1.65rem; font-size: 1rem; font-weight: 700; }
    section { padding: clamp(1.5rem, 5vw, 2.5rem); }
    h1 { margin: 0; line-height: 1.2; font-size: clamp(1.65rem, 5vw, 2.5rem); letter-spacing: -.035em; }
    p { margin: .85rem 0 1.35rem; color: #455c75; line-height: 1.65; }
    a { display: inline-block; padding: .65rem 1rem; border-radius: 7px; background: #234b74; color: #fff; font-weight: 700; text-decoration: none; }
    a:hover { background: #153b63; }
    a:focus-visible { outline: 3px solid #146bbd; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <header>餐廳營運後台</header>
    <section>
      <h1>訂位與備餐管理</h1>
      <p>查看已成立的訂位、各餐期人數和預估備餐份數。開啟後台後請以店家帳號登入。</p>
      <a href="https://anaheim-ericsson-dice-circular.trycloudflare.com/dashboard/" rel="noreferrer">開啟後台</a>
    </section>
  </main>
</body>
</html>
